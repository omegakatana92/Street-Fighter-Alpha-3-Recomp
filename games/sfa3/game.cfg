# Street Fighter Alpha 3 (Capcom 1998, CPS-2 arcade board): per-game settings read by the cps2recomp
# toolkit (Makefile, tools and launcher via cps2recomp/tools/gamecfg.py).

name = Street Fighter Alpha 3
# What the window is called (the name stays the folder the player's settings are kept under)
title = Street Fighter Alpha 3 Recomp
id = sfa3
# Reverse-DNS app identifier (macOS bundle id / launcher).
app_id = io.github.omegakatana92.sfa3
disclaimer = Not affiliated with Capcom.

# The ROM set this port is made from, as arcade ROM collections name it, and the name the launcher shows.
# `sfa3` is MAME's parent set (Europe 980904); its clones (sfa3u, sfa3ur1, sfa3us, sfa3h, sfa3hr1, sfa3b)
# and the bootleg are built from the same board and are not accepted here.
rom_set = sfa3
rom_parent = sfa3
rom_name = Street Fighter Alpha 3 (Europe 980904)

# The set's files, each with its CRC32 (file:crc ...), in the order they sit on the board.
# program: the 68000's ROMs (16-bit words, eight 512 KiB files: 4 MiB). graphics: four files side by
# side per row (64-bit words), two rows of 4 MiB files (32 MiB in all): sz3.13m/15m/17m/19m, then
# sz3.14m/16m/18m/20m, and the region is populated from 0 (no leading hole, unlike Street Fighter Alpha).
# sound_program: the Z80's ROMs (sz3.01, sz3.02). samples: the QSound chip's (sz3.11m, sz3.12m, 8 MiB).
# key: the board's cipher key.
program = sz3e.03c:9762b206 sz3e.04c:5ad3f721 sz3.05c:57fd0a40 sz3.06c:f6305f8b sz3.07c:6eab0f6f sz3.08c:910c4a3b sz3.09c:b29e5199 sz3.10b:deb2ff52
graphics = sz3.13m:0f7a60d9 sz3.15m:8e933741 sz3.17m:d6e98147 sz3.19m:f31a728a sz3.14m:5ff98297 sz3.16m:52b5bdee sz3.18m:40631ed5 sz3.20m:763409b4
sound_program = sz3.01:de810084 sz3.02:72445dc4
samples = sz3.11m:1c89eed1 sz3.12m:f392b13a
key = sfa3.key:54fa39c6

# Where the game's code ends in the 68000's ROM (hex): the translator does not look past this. The
# maincpu region is 4 MiB (eight 512 KiB ROMs), so this spans the whole program.
code_end = 400000
